repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
        exclude: '^\.zsh\.d/'  # zsh config files are sourced, not executed

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ["-e", "SC1090,SC1091"]  # Ignore source file not found warnings
        exclude: '^\.zshenv$|^\.zshrc$|^\.zsh\.d/'  # Exclude zsh config files

  # ax のスキル（apm.yml）と CLI（packages.toml）の版が揃っているかを確かめる
  - repo: local
    hooks:
      - id: ax-version-sync
        name: ax の版が apm.yml と packages.toml で一致する
        entry: etc/pre-commit/check-ax-version.sh
        language: script
        files: ^(\.apm/apm\.yml|\.config/mise/conf\.d/packages\.toml)$
        pass_filenames: false
